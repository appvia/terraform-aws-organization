---
name: Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-organization:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@b2042fe251447efbe801c4ad02e6433c5304d16c # main
    name: Organization Module Validation
    with:
      working-directory: examples/basic

  validate-delegation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@b2042fe251447efbe801c4ad02e6433c5304d16c # main
    name: Delegation Module Validation
    with:
      working-directory: modules/delegation

  validate-service-quotas:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@b2042fe251447efbe801c4ad02e6433c5304d16c # main
    name: Service Quotas Module Validation
    with:
      working-directory: modules/service_quotas
